name: Metrics

on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Token gerado automaticamente pelo GitHub (atenção a letras minúsculas)
          token: ${{ secrets.METRICS_TOKEN }}

          # O que você quer mostrar no card
          display: classic
          plugin_languages: yes
          plugin_languages_ignored: not-code
          plugin_languages_limit: 6
          plugin_lines: yes
